[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainsolve"
version = "0.6.10"
description = "程序设计训练平台自动刷题工具（DeepSeek 可插拔；可选浏览器逐字符打字模式）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 只有「模拟人类打字」模式需要；核心功能零第三方依赖
human = ["playwright>=1.40"]

[project.scripts]
trainsolve = "trainsolve.cli:main"

[tool.setuptools]
packages = ["trainsolve", "trainsolve.solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
